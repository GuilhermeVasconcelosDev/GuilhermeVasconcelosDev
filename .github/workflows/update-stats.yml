name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Roda automaticamente todo dia à meia-noite
  workflow_dispatch: # Permite que você ative manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Gera o cartão de estatísticas gerais
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=radial
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      # Gera o cartão das linguagens mais usadas
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=radial
          path: profile/languages.svg
          token: ${{ secrets.GH_TOKEN }}

      # Salva as imagens geradas de volta no seu repositório
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile README stats cards" || echo "No changes to commit"
          git push
